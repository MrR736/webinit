
plugins {
    id 'com.android.library'
    id 'maven-publish'
}

def releaseVersion = (System.getenv("GITHUB_REF_NAME") ?: "1.1.0")
        .replaceFirst(/^v/, "")

group = "com.mrr736.webinit"
version = releaseVersion

android {
    namespace "com.mrr736.webinit"
    compileSdk 37

    ndkVersion "27.0.12077973"

    defaultConfig {
        minSdk 26
        targetSdk 37

        versionCode 100
        versionName releaseVersion

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
        }
    }

    publishing {
        singleVariant("release")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.7.1") {
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
    }

    implementation("androidx.webkit:webkit:1.14.0") {
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
    }

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    implementation "io.github.mlm-games:adblock:0.1.3"
}

afterEvaluate {
    publishing {
        publications {
            register("release", MavenPublication) {
                groupId = "com.mrr736.webinit"
                artifactId = "lib"
                version = releaseVersion

                from components.release
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri(
                    "https://maven.pkg.github.com/MrR736/webinit"
                )

                credentials {
                    username = System.getenv("GITHUB_ACTOR") ?: "MrR736"
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}
